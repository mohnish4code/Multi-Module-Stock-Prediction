[project]
name = "alphastream"
version = "2.0.0"
description = "Multi-module NSE stock forecasting with honest walk-forward evaluation, a FastAPI service and a React web app."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE", "S", "PT"]
ignore = [
    "S101",  # assert in tests
    "S311",  # non-crypto RNG is fine for ML seeds
    "PT011", # broad pytest.raises(ValueError) is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"notebooks/*" = ["E402", "I001"]  # notebooks add the repo to sys.path before importing it

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
